<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Responsável')}"></head>
<body>

<aside th:replace="~{fragments/layout :: sidebar('responsaveis')}"></aside>

<div class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Cadastro de Responsável')}"></header>

    <main class="app-content" style="max-width: 820px;">
        <div class="mb-4">
            <div class="eyebrow-label">AGENTES DE GUARDA PATRIMONIAL</div>
            <h1 class="page-title" th:text="${responsavel.id == null} ? 'Inserir Servidor Responsável' : 'Editar Servidor Responsável'">Responsável</h1>
            <p class="page-subtitle">Vincule o servidor ao seu setor de lotação para emissão de termos de cautela.</p>
        </div>

        <div class="figma-card p-4">
            <form th:action="@{/responsaveis/salvar}" th:object="${responsavel}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">
                    <div class="col-12">
                        <label for="setor" class="form-label fw-semibold small">Setor / Unidade Administrativa *</label>
                        <select id="setor" th:field="*{setor}" class="form-select"
                                th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'">
                            <option value="">-- Selecione o setor de lotação --</option>
                            <option th:each="s : ${setores}" th:value="${s.id}" th:text="${s.identificacao}">SECADM - Secretaria</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{setor}"></div>
                    </div>

                    <div class="col-md-8">
                        <label for="nome" class="form-label fw-semibold small">Nome Completo do Servidor *</label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               placeholder="Nome completo do servidor">
                        <div class="invalid-feedback" th:errors="*{nome}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="matricula" class="form-label fw-semibold small">Matrícula Funcional *</label>
                        <input type="text" id="matricula" th:field="*{matricula}" class="form-control"
                               th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'"
                               placeholder="Ex: 10458-2">
                        <div class="invalid-feedback" th:errors="*{matricula}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="cargo" class="form-label fw-semibold small">Cargo / Função</label>
                        <input type="text" id="cargo" th:field="*{cargo}" class="form-control"
                               placeholder="Ex: Analista Administrativo, Coordenador">
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold small">E-mail Institucional</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="servidor@orgao.gov.br">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a th:href="@{/responsaveis}" class="btn-figma-outline">Cancelar</a>
                    <button type="submit" class="btn-figma-primary">
                        <i class="bi bi-check-lg"></i> Salvar Responsável
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
