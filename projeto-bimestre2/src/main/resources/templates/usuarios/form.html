<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Usuário')}"></head>
<body>

<aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>

<div class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Cadastro de Usuário')}"></header>

    <main class="app-content" style="max-width: 820px;">
        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="mb-4">
            <div class="eyebrow-label">CONTROLE DE ACESSO</div>
            <h1 class="page-title" th:text="${usuario.id == null} ? 'Cadastrar Novo Usuário' : 'Editar Usuário e Permissões'">Usuário</h1>
            <p class="page-subtitle">Defina credenciais de acesso, perfil de permissão e secretaria vinculada.</p>
        </div>

        <div class="figma-card p-4">
            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{ativo}"/>

                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="nome" class="form-label fw-semibold small">Nome Completo *</label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="matricula" class="form-label fw-semibold small">Matrícula</label>
                        <input type="text" id="matricula" th:field="*{matricula}" class="form-control" placeholder="Ex: 10293">
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold small">E-mail de Acesso (Login) *</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="novaSenha" class="form-label fw-semibold small"
                               th:text="${usuario.id == null} ? 'Senha Inicial *' : 'Nova Senha (deixe em branco para manter)'">Senha</label>
                        <input type="password" id="novaSenha" name="novaSenha" class="form-control" th:required="${usuario.id == null}">
                    </div>

                    <div class="col-md-6">
                        <label for="perfil" class="form-label fw-semibold small">Perfil de Permissão *</label>
                        <select id="perfil" th:field="*{perfil}" class="form-select">
                            <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao + ' — ' + p.resumoPermissao}">Perfil</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="setor" class="form-label fw-semibold small">Secretaria / Setor Vinculado</label>
                        <select id="setor" th:field="*{setor}" class="form-select">
                            <option value="">-- Administração Central (Acesso Global) --</option>
                            <option th:each="s : ${setores}" th:value="${s.id}" th:text="${s.identificacao}">Setor</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a th:href="@{/usuarios}" class="btn-figma-outline">Cancelar</a>
                    <button type="submit" class="btn-figma-primary"><i class="bi bi-check-lg"></i> Salvar Usuário</button>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
