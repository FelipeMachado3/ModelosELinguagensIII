<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Acesso — Redefinir Senha | Patrimônio Público</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0B1E38 0%, #132C4E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
            width: 100%;
            max-width: 460px;
            padding: 36px;
        }
        .brand-badge {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="d-flex align-items-center gap-3 mb-3">
        <div class="brand-badge"><i class="bi bi-shield-lock-fill"></i></div>
        <div>
            <h1 class="h5 fw-bold text-dark mb-0">Primeiro Acesso Detectado</h1>
            <span class="text-muted small" th:text="${usuario.nome} + ' (' + ${usuario.email} + ')'">Usuário</span>
        </div>
    </div>

    <p class="small text-secondary mb-4">
        Por segurança, defina uma nova senha pessoal antes de acessar os módulos do sistema.
    </p>

    <div th:if="${erro}" class="alert alert-danger py-2 small border-0">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${erro}">Erro</span>
    </div>

    <form th:action="@{/primeiro-acesso}" method="post">
        <div class="mb-3">
            <label for="novaSenha" class="form-label fw-semibold small">Nova Senha (mínimo 6 caracteres)</label>
            <input type="password" id="novaSenha" name="novaSenha" class="form-control" minlength="6" placeholder="Digite sua nova senha" required autofocus>
        </div>
        <div class="mb-4">
            <label for="confirmarSenha" class="form-label fw-semibold small">Confirmar Nova Senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control" minlength="6" placeholder="Repita a nova senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" style="background-color: #1D63DC;">
            Salvar Nova Senha e Acessar <i class="bi bi-check2-circle ms-1"></i>
        </button>
    </form>

    <div class="mt-3 text-center">
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link btn-sm text-muted text-decoration-none">
                <i class="bi bi-box-arrow-left me-1"></i> Sair e voltar ao login
            </button>
        </form>
    </div>
</div>
</body>
</html>
