
spring.application.name=projeto-bimestre2

# Porta do servidor Spring Boot
server.port=8081

# Configuração do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/projeto_bimestre2
spring.datasource.username=projeto
spring.datasource.password=projeto123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.compression.enabled=false
server.http2.enabled=false

# Gestão de anexos e limites de upload
app.upload.dir=uploads/anexos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB